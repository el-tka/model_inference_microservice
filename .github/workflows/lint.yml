# This is my first GitHub Actions workflow!

name: ML Inference CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04

    env:
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
      POETRY_VIRTUALENVS_CREATE: "true"
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build application
        uses: ./.github/actions/build-application

      - name: Lint
        run: poetry run flake8 app/ tests/

      - name: Run tests
        run: poetry run pytest tests/ -v

      - name: Test coverage
        run: poetry run pytest --cov=app tests/
