[project]
name = "inference-service"
version = "0.1.0"
description = ""
authors = [
    {name = "Elena",email = "lady.dialog2013@yandex.ru"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "flask (>=3.1.3,<4.0.0)",
    "pydantic (>=2.14.3,<3.0.0)",
    "joblib (>=1.6.0,<2.0.0)",
    "numpy (>=2.5.4,<3.0.0)",
    "pandas (>=3.1.1,<4.0.0)",
    "loguru (>=0.8.0,<0.9.0)",
    "pydantic-settings (>=2.16.3,<3.0.0)",
    "xgboost (>=3.4.1,<4.0.0)",
    "flake8 (>=7.5.0,<8.0.0)",
    "catboost (>=1.2.10,<2.0.0)",
    "lightgbm (>=4.7.0,<5.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "flask-cors (>=6.0.5,<7.0.0)",
    "gunicorn (>=27.0.1,<28.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "flake8 (>=7.5.0,<8.0.0)"
]
